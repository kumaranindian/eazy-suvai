name: owner_app
description: EazySuvai owner app (web, Android, iOS).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
    path: ../../packages/core
  go_router: ^17.0.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  cloud_functions: ^7.0.1
  timezone: ^0.10.1
  webview_flutter: ^4.13.1
  web: ^1.1.1
  qr: ^3.0.3
  zxing2: ^0.2.4
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0+1
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # Poppins (SIL OFL 1.1, OFL.txt) for the QR PDFs (M08).
    - assets/fonts/
  generate: true

# Generates Android and iOS launcher icons:
#   dart run flutter_launcher_icons   (from apps/owner_app)
# Web icons and favicons are copied from docs/brand/favicon/ into web/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/app_icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#FFF8EE"
  adaptive_icon_foreground: branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
