name: admin_app
description: EazySuvai platform admin app (web).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
    path: ../../packages/core
  go_router: ^17.0.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  cloud_functions: ^7.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  generate: true
