name: core
description: Shared EazySuvai code - money, time, theme, layout, widgets, l10n, environment.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ">=3.0.0 <4.0.0"
  freezed_annotation: ^3.1.0
  google_fonts: ^6.3.2
  image: ^4.5.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  phone_numbers_parser: ^9.0.29
  riverpod_annotation: ">=3.0.0 <5.0.0"
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  generate: true
